<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>pkw bench</title></head>
<body>
<script>
// Harness: serve pikafish.js / pikafish.wasm / pikafish.nnue / worker.js from same dir.
// All log lines are POSTed to /__log so a headless run can be inspected afterwards.
function log(s) {
  fetch('/__log', { method: 'POST', body: String(s) }).catch(() => {});
  console.log(s);
}
// Optional query overrides: bench.html?threads=1&tag=xyz
const QS = new URLSearchParams(location.search);
window.THREADS = +(QS.get('threads') || 4);
const TAG = QS.get('tag') || '';
log('HARNESS tag=' + TAG + ' threads=' + window.THREADS);
const worker = new Worker('./worker.js');
const lines = [];
let ready = false;
worker.onmessage = (ev) => {
  const d = ev.data;
  log('MSG ' + d.type + (d.type === 'net-progress' ? (' ' + d.loaded + '/' + d.total) : '') + (d.error ? (' err=' + d.error) : '') + (d.line ? (' ' + d.line) : '') + (d.bytes ? (' bytes=' + d.bytes) : ''));
  if (d.type === 'net-progress') {
    if (d.loaded === d.total) log('net-progress DONE ' + d.loaded + '/' + d.total);
  } else if (d.type === 'ready') {
    ready = true;
    log('READY');
    worker.postMessage({ type: 'command', command: 'uci' });
    setTimeout(() => worker.postMessage({ type: 'command', command: 'setoption name Threads value ' + (window.THREADS || 4) }), 1500);
    setTimeout(() => worker.postMessage({ type: 'command', command: 'setoption name Hash value 256' }), 1600);
    setTimeout(runBench, 3500);
  } else if (d.type === 'line') {
    lines.push(d.line);
    if (/NNUE evaluation|bestmove|uciok/.test(d.line)) log('LINE: ' + d.line);
  } else if (d.type === 'stderr') {
    log('STDERR: ' + d.line);
  } else if (d.type === 'error') {
    log('ERROR: ' + d.error);
  }
};

async function search(ms) {
  const mark = lines.length;
  worker.postMessage({ type: 'command', command: 'position fen rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1' });
  worker.postMessage({ type: 'command', command: 'go movetime ' + ms });
  await new Promise(r => setTimeout(r, ms + 3000));
  let depth = 0, nodes = 0, score = null, move = null;
  for (let i = mark; i < lines.length; i++) {
    const l = lines[i];
    const dd = /info depth (\d+)/.exec(l); if (dd) depth = Math.max(depth, +dd[1]);
    const nn = /nodes (\d+)/.exec(l); if (nn) nodes = Math.max(nodes, +nn[1]);
    const ss = /score (cp (-?\d+)|mate (-?\d+))/.exec(l); if (ss) score = ss[2] !== undefined ? +ss[2] : (ss[3] > 0 ? 99999 : -99999);
    if (/^bestmove /.test(l)) move = l.split(/\s+/)[1];
  }
  return { depth, nodes, score, move };
}

async function runBench() {
  log('BENCH START threads=' + (window.THREADS || 4));
  const t0 = Date.now();
  for (const ms of [500, 2000, 6000]) {
    const r = await search(ms);
    log('BENCH ' + ms + 'ms -> depth ' + r.depth + ' nodes ' + r.nodes + ' score ' + r.score + ' move ' + r.move);
  }
  log('BENCH DONE total=' + (Date.now() - t0) + 'ms');
  document.title = 'DONE';
}

worker.postMessage({
  type: 'init',
  jsUrl: './pikafish.js',
  wasmUrl: './pikafish.wasm',
  netUrl: './pikafish.nnue',
});
</script>
</body>
</html>
