<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>nothreads no-isolation test</title></head>
<body>
<script>
// The single-thread (no pthread) build: does it run with NO COOP/COEP and NO service worker?
const LOG = (s) => { fetch('/__log', { method: 'POST', body: String(s) }).catch(() => {}); };
LOG('NT boot coi=' + self.crossOriginIsolated + ' sab=' + (typeof SharedArrayBuffer !== 'undefined'));
const w = new Worker('./worker_nt.js');
w.onmessage = (ev) => {
  const d = ev.data || {};
  if (d.type === 'net-progress' && d.loaded === d.total) LOG('NT net fetched');
  if (d.type === 'ready') {
    LOG('NT READY (no isolation!)');
    w.postMessage({ type: 'command', command: 'uci' });
    setTimeout(() => {
      w.postMessage({ type: 'command', command: 'setoption name Threads value 2' });
      w.postMessage({ type: 'command', command: 'setoption name Hash value 256' });
      w.postMessage({ type: 'command', command: 'isready' });
      setTimeout(() => {
        w.postMessage({ type: 'command', command: 'position fen rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1' });
        w.postMessage({ type: 'command', command: 'go movetime 2000' });
      }, 1200);
    }, 1000);
  }
  if (d.type === 'line') {
    if (/NNUE evaluation|bestmove|Using|thread/.test(d.line)) LOG('NT line: ' + d.line);
  }
  if (d.type === 'stderr') LOG('NT stderr: ' + d.line);
  if (d.type === 'error') { LOG('NT ERROR: ' + d.error); document.title = 'DONE'; }
};
w.onerror = (e) => LOG('NT worker onerror: ' + e.message);
setTimeout(() => { LOG('NT DONE (timeout)'); document.title = 'DONE'; }, 30000);
w.postMessage({ type: 'init', jsUrl: './pikafish_nt.js', wasmUrl: './pikafish_nt.wasm', netUrl: './pikafish.nnue' });
</script>
</body>
</html>
