<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>levels baseline driver</title></head>
<body>
<script>
/* levels_driver.html — TEST-ONLY harness for card t_ef6e93b8 (五档基准验证).
 * Task JSON: { pre:[...], round:int, refMs:int, refHash:int,
 *              configs:[{id,multipv,slot,movetime,hash}],
 *              positions:[{id,group,fen,moves?}] }
 *
 * Per position, per round:
 *   ANCHOR : MultiPV=1, movetime refMs  -> yardstick eval of the position (side-to-move view)
 *   per config: setoption Hash/MultiPV, position, go movetime -> collect info per multipv slot,
 *               chosen = pv head of slot cfg.slot   -> SEL line (all slot scores, depth, nodes)
 *   REF    : MultiPV=1, movetime refMs, position fen <fen> moves <chosen> -> eval after playing it
 *
 * Log lines (POSTed to /__log):
 *   L|<round>|<posId>|ANCHOR|score=..|cp|depth=..|nodes=..|crit=0
 *   L|<round>|<posId>|<cfgId>|SEL|move=..|slotScore=..|top1=..|gap=..|depth=..|nodes=..|slots=1:s,2:s|crit=0
 *   L|<round>|<posId>|<cfgId>|REF|move=..|score=..|depth=..|nodes=..|crit=0
 *   L|<round>|<posId>|<cfgId>|SKIP|reason=..
 * Score convention: engine's own side-to-move view; mate scores mapped to +/-100000-100*ply.
 */
const LOG = (s) => { return fetch('/__log', { method: 'POST', body: String(s) }).catch(() => {}); };
const TASK = new URLSearchParams(location.search).get('task') || 'task_levels.json';
if (!self.crossOriginIsolated) {
  const t = +(sessionStorage.getItem('drvN') || 0);
  sessionStorage.setItem('drvN', String(t + 1));
  if (t < 3) { LOG('DRV: not isolated, registering SW (try ' + t + ')'); navigator.serviceWorker.register('./coi-serviceworker.js').then(() => location.reload()).catch(e => LOG('DRV SW fail ' + e)); }
  else { LOG('DRV: gave up'); document.title = 'NOISO'; }
} else { main(); }

let activeCollector = null;

async function main() {
  LOG('DRV: isolated ok, task=' + TASK);
  const task = await (await fetch('./' + TASK)).json();
  const w = new Worker('./worker_mb.js');
  w.onmessage = (ev) => {
    const d = ev.data || {};
    if (d.type === 'line') {
      const line = String(d.line);
      if (activeCollector) activeCollector(line);
    } else if (d.type === 'stderr') { LOG('DRVerr: ' + d.line); }
    else if (d.type === 'error') { LOG('DRV error ' + d.error); document.title = 'ERR'; }
    else if (d.type === 'ready') { LOG('DRV: engine ready'); }
  };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  await new Promise((res) => {
    const orig = w.onmessage;
    w.onmessage = (ev) => { if (ev.data && ev.data.type === 'ready') { orig(ev); res(); } else orig(ev); };
    w.postMessage({ type: 'init', jsUrl: './pikafish.js', wasmUrl: './pikafish.wasm', netUrl: './pikafish.nnue' });
    setTimeout(res, 60000);
  });

  for (const cmd of (task.pre || [])) { w.postMessage({ type: 'command', command: cmd }); await sleep(120); }

  async function runSearch(cmds, timeoutMs) {
    const lines = [];
    let bmResolve = null;
    activeCollector = (l) => {
      lines.push(l);
      if (/^bestmove/.test(l) && bmResolve) { const r = bmResolve; bmResolve = null; r(); }
    };
    for (const cmd of cmds) {
      w.postMessage({ type: 'command', command: cmd });
      await sleep(150);
      if (/^go(\s|$)/.test(cmd)) {
        await new Promise((res) => {
          let done = false;
          bmResolve = () => { if (!done) { done = true; res(); } };
          setTimeout(() => { if (!done) { done = true; res(); } }, timeoutMs);
        });
      }
    }
    activeCollector = null;
    return lines;
  }

  function parse(lines) {
    const slots = {}; let nodes = null, depth = 0, crit = 0, bestmove = null;
    for (const l of lines) {
      if (l.indexOf('CRITICAL ERROR') >= 0) crit++;
      if (/^bestmove/.test(l)) { const m = l.match(/^bestmove (\S+)/); if (m) bestmove = m[1]; }
      const nm = l.match(/\bnodes (\d+)/); if (nm) nodes = +nm[1];
      const dm = l.match(/\bdepth (\d+)/); if (dm) depth = Math.max(depth, +dm[1]);
      const mm = l.match(/\bmultipv (\d+)/); if (!mm) continue;
      const sm = l.match(/\bscore (cp|mate) (-?\d+)/); if (!sm) continue;
      const pm = l.match(/\bpv (.+)$/);
      let val;
      if (sm[1] === 'mate') { const n = +sm[2]; val = n > 0 ? 100000 - 100 * n : -100000 + 100 * n; }
      else val = +sm[2];
      slots[+mm[1]] = { score: val, mate: sm[1] === 'mate' ? (+sm[2]) : null, pv: pm ? pm[1].trim().split(/\s+/) : [] };
    }
    return { slots, nodes, depth, crit, bestmove };
  }

  const REF_MS = task.refMs || 2000, REF_HASH = task.refHash || 256;
  const MOVE_RE = /^[a-i][0-9][a-i][0-9]$/;

  for (const pos of task.positions) {
    const R = task.round;
    const posCmd = (extra) => {
      let c = 'position fen ' + pos.fen;
      const mv = (pos.moves || []).concat(extra || []);
      if (mv.length) c += ' moves ' + mv.join(' ');
      return c;
    };
    // ANCHOR
    let lines = await runSearch([
      'setoption name MultiPV value 1',
      'setoption name Hash value ' + REF_HASH,
      posCmd(null),
      'go movetime ' + REF_MS,
    ], REF_MS + 20000);
    let p = parse(lines);
    const anchor = p.slots[1];
    if (!anchor) { LOG('L|' + R + '|' + pos.id + '|ANCHOR|SKIP|no slot1|lines=' + lines.length); continue; }
    LOG('L|' + R + '|' + pos.id + '|ANCHOR|score=' + anchor.score + '|mate=' + (anchor.mate === null ? '-' : anchor.mate) +
        '|depth=' + p.depth + '|nodes=' + p.nodes + '|crit=' + p.crit);

    for (const cfg of task.configs) {
      lines = await runSearch([
        'setoption name Hash value ' + cfg.hash,
        'setoption name MultiPV value ' + cfg.multipv,
        posCmd(null),
        'go movetime ' + cfg.movetime,
      ], cfg.movetime + 20000);
      p = parse(lines);
      const slot = p.slots[cfg.slot];
      const top1 = p.slots[1];
      if (!slot || !slot.pv.length) { LOG('L|' + R + '|' + pos.id + '|' + cfg.id + '|SKIP|no slot ' + cfg.slot + '|lines=' + lines.length); continue; }
      const chosen = slot.pv[0];
      const slotStr = Object.keys(p.slots).sort((a, b) => a - b).map(k => k + ':' + p.slots[k].score).join(',');
      LOG('L|' + R + '|' + pos.id + '|' + cfg.id + '|SEL|move=' + chosen + '|slotScore=' + slot.score +
          '|top1=' + (top1 ? top1.score : 'NA') + '|gap=' + (top1 ? top1.score - slot.score : 'NA') +
          '|depth=' + p.depth + '|nodes=' + p.nodes + '|slots=' + slotStr + '|crit=' + p.crit);
      if (!MOVE_RE.test(chosen)) { LOG('L|' + R + '|' + pos.id + '|' + cfg.id + '|REF|SKIP|bad move ' + chosen); continue; }
      lines = await runSearch([
        'setoption name MultiPV value 1',
        'setoption name Hash value ' + REF_HASH,
        posCmd([chosen]),
        'go movetime ' + REF_MS,
      ], REF_MS + 20000);
      p = parse(lines);
      const r = p.slots[1];
      if (!r) { LOG('L|' + R + '|' + pos.id + '|' + cfg.id + '|REF|SKIP|no ref slot1|crit=' + p.crit); continue; }
      LOG('L|' + R + '|' + pos.id + '|' + cfg.id + '|REF|move=' + chosen + '|score=' + r.score +
          '|mate=' + (r.mate === null ? '-' : r.mate) + '|depth=' + p.depth + '|nodes=' + p.nodes + '|crit=' + p.crit);
    }
  }
  LOG('DRV DONE positions=' + task.positions.length + ' round=' + task.round);
  document.title = 'DONE';
}
</script>
</body>
</html>
